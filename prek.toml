default_stages = ["pre-commit"]
minimum_prek_version = "0.3.5"
default_install_hook_types = ["commit-msg", "pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-added-large-files", args = ["--maxkb=1024"], priority = 0 },
  { id = "check-merge-conflict", priority = 0 },
  { id = "detect-private-key", priority = 0 },
  { id = "mixed-line-ending", args = ["--fix=lf"], priority = 0 },
  { id = "no-commit-to-branch", priority = 0 },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.44.0"
hooks = [{ id = "typos", priority = 1 }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "betterleaks"
name = "Detect hardcoded secrets"
entry = "betterleaks git --pre-commit --redact --staged --verbose"
language = "system"
pass_filenames = false
priority = 1

[[repos.hooks]]
id = "nu-check"
name = "nushell syntax check"
entry = "nu --ide-check 0"
language = "system"
types_or = ["file"]
files = '\.(nu)$'
priority = 1
